server:
  port: 8222
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
              - id: account-service
                uri: lb://ACCOUNT-SERVICE
                predicates:
                 - Path=/api/accounts/**

              - id: payment-service
                uri: lb://PAYMENT-SERVICE
                predicates:
                  - Path=/api/payments/**

              - id: fraud-service
                uri: lb://FRAUD-SERVICE
                predicates:
                  - Path=/api/fraud/**

              - id: transaction-service
                uri: lb://TRANSACTION-SERVICE
                predicates:
                  - Path=/api/transactions/**

              - id: notification-service
                uri: lb://NOTIFICATION-SERVICE
                predicates:
                  - Path=/api/notifications/**